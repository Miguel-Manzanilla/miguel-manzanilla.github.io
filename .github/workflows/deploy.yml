# Despliegue del sitio a GitHub Pages.
#
# Antes coexistian cuatro workflows (deploy.yml, static.yml, autofix.ci y
# autofix.yml). static.yml era el mas peligroso: subia el repositorio entero
# como artefacto de Pages en lugar de la carpeta dist/, publicando tambien el
# codigo fuente y los lockfiles. Se ha unificado todo en este fichero.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite relanzar el despliegue desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca dos despliegues a la vez: el segundo se cancela.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # withastro/action instala con pnpm (detectado por el lockfile),
      # compila y deja el artefacto listo para Pages.
      - name: Instalar, compilar y subir el sitio
        uses: withastro/action@v3
        with:
          path: .
          node-version: 20
          package-manager: pnpm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
